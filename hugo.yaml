# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://sinohavn.github.io/"
title: 避风港
languageCode: zh
copyright: "© 2024 [sinohavn](mailto:sinohavn5@gmail.com)"
theme: [PaperMod]

pagination:
  pagerSize: 5

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true


outputs:
  home:
    - HTML
    - RSS
    - JSON


params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "SinoHavn - 一个在丹麦建立的泛中文酷儿社群，致力于为在海外的华人酷儿群体提供支持和连接的桥梁。"
  author: SinoHavn
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["/images/favicon.ico"]

  profileMode:
    enabled: false
    title: SinoHavn
    imageUrl: "/images/favicon.ico"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: posts
      - name: Tags
        url: tags

  homeInfoParams:
    title: "欢迎来到避风港!"
    content: |
          这里是一个专为在丹麦的泛中文酷儿群体创建的温暖港湾 🌙
          如果你正在丹麦生活、学习、工作，或只是短暂停留，都欢迎从这里认识我们。

          <div class="home-actions">
            <a class="home-action primary" href="/local-events-guide/">查看近期活动</a>
            <a class="home-action" href="/about/">加入或联系我们</a>
            <a class="home-action" href="/tags/resource/">阅读生活资源</a>
          </div>

          <p class="home-notice"><strong>近期活动更新中。</strong>如果页面上暂时没有新的活动，请通过 Instagram、小红书或邮件关注最新消息，也欢迎来信一起发起活动。</p>

          我们分享：

          - 🎉 [**小型聚会、手工坊、读书会等活动**](/tags/workshop/) —— 不定期由我们组织
          - 🎊 [**当地节庆活动和生活指南**](/tags/resource/) —— 助你更好地融入生活
          - 🌈 [**关于酷儿群体的深度文章**](/tags/discussion/) —— 提供多样化的视角

          🌱 **注**：由于性别议题不断发展，内容可能有局限，欢迎友好交流！本网站中的言论仅代表作者观点。

    image:
      url: "/images/favicon.svg"
    
    
  socialIcons:
    - name: xiaohongshu
      url: "https://www.xiaohongshu.com/user/profile/654d4c740000000002036b1c?xhsshare=CopyLink&appuid=5c8132d200000000120396f1&apptime=1730674113&share_id=08e23301b7e146579713628ce968d600"
    - name: instagram
      url: "https://www.instagram.com/havn_sinoqueer?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
    - name: email
      url: "mailto:sinohavn5@gmail.com" 

  editPost:
    URL: "https://github.com/sinohavn/sinohavn.github.io/tree/source/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # label:
  # text: "主页"
  # icon: /images/favicon.svg
  # iconHeight: 35

  # analytics:
  #     google:
  #         SiteVerificationTag: "XYZabc"

  assets:
    favicon: "/images/favicon.ico"
    favicon16x16: "/images/favicon-16x16.png"
    favicon32x32: "/images/favicon-32x32.png"
    apple_touch_icon: "/images/apple-touch-icon.png"
    safari_pinned_tab: "/images/favicon.svg"

  # cover:
  #     hidden: true # hide everywhere but not in structured data
  #     hiddenInList: true # hide on list pages and home
  #     hiddenInSingle: true # hide on single page

  # fuseOpts:
