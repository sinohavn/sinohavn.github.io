name: Deploy Hugo Website to Pages

on:
  push:
    paths-ignore:
      - "images/**"
      - "LICENSE"
      - "README.md"
    branches:
      - main
      - source
  workflow_dispatch:
    # manual run
    inputs:
      hugoVersion:
        description: "Hugo Version"
        required: false
        default: "0.136.5"

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: ${{ github.event.inputs.hugoVersion || '0.136.5' }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: source
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3
      - name: Get Theme
        run: git submodule update --init --recursive
      - name: Update theme to Latest commit
        run: git submodule update --remote --merge
      - name: Build with Hugo
        run: |
          hugo --buildDrafts --gc --baseURL ${{ steps.pages.outputs.base_url }}
          ls -lah ./public  # Debugging: Ensure Hugo actually creates files
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3  # Use the latest version
        with:
          path: ./public
  # Deployment job
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write    
      id-token: write  
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages  # Ensure this matches the artifact name
          path: ./artifact  # Use a temporary folder to avoid conflicts

      - name: Debug Artifact Contents
        run: ls -lah ./artifact || echo "No artifact files found!"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        with:
          artifact_path: ./artifact  # Ensure deploy-pages uses the correct path
 
